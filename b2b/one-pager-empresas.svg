<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" width="816" height="1056"><rect width="816" height="1056" fill="#F2EFE6"/><rect x="0" y="0" width="816" height="132" fill="#0E2A1C"/><g transform="translate(38,16) scale(0.093)" opacity="1.0"><rect x="525.0" y="792.0" width="30.0" height="58.0" rx="5.0" fill="#8FA98A"/><path d="M 540.0,780.8 C 435.8,831.2 309.4,867.6 168.0,881.6 L 316.8,874.6 L 428.4,886.6 L 540.0,875.6 L 651.6,886.6 L 763.2,874.6 L 912.0,881.6 C 770.6,867.6 644.2,831.2 540.0,780.8 Z" fill="#BACDB4"/><path d="M 540.0,640.8 C 459.9,691.2 362.6,727.6 253.9,741.6 L 368.4,734.6 L 454.2,746.6 L 540.0,735.6 L 625.8,746.6 L 711.6,734.6 L 826.1,741.6 C 717.4,727.6 620.1,691.2 540.0,640.8 Z" fill="#8FA98A"/><path d="M 540.0,500.8 C 483.0,551.2 413.8,587.6 336.5,601.6 L 417.9,594.6 L 478.9,606.6 L 540.0,595.6 L 601.1,606.6 L 662.1,594.6 L 743.5,601.6 C 666.2,587.6 597.0,551.2 540.0,500.8 Z" fill="#BACDB4"/><path d="M 540.0,360.8 C 504.7,411.2 461.9,447.6 414.0,461.6 L 464.4,454.6 L 502.2,466.6 L 540.0,455.6 L 577.8,466.6 L 615.6,454.6 L 666.0,461.6 C 618.1,447.6 575.3,411.2 540.0,360.8 Z" fill="#8FA98A"/><path d="M 540.0,220.8 C 523.2,271.2 502.8,307.6 480.0,321.6 L 504.0,314.6 L 522.0,326.6 L 540.0,315.6 L 558.0,326.6 L 576.0,314.6 L 600.0,321.6 C 577.2,307.6 556.8,271.2 540.0,220.8 Z" fill="#BACDB4"/><polygon points="540.0,152.0 549.4,177.1 576.1,178.3 555.2,194.9 562.3,220.7 540.0,206.0 517.7,220.7 524.8,194.9 503.9,178.3 530.6,177.1" fill="#C9A227"/></g><text x="140" y="58" font-family="EB Garamond" font-size="30" font-weight="bold" fill="#F2EFE6">ÁRBOLES DE NAVIDAD NATURALES</text><text x="142" y="84" font-family="Lato" font-size="13" fill="#C9A227" letter-spacing="3">ABETO NOBLE DE OREGON · IMPORTACIÓN DIRECTA</text><text x="142" y="108" font-family="Lato" font-size="12" fill="#BACDB4">Cuarta temporada · CDMX y Estado de México</text><text x="54" y="186" font-family="EB Garamond" font-size="34" fill="#14251C">Propuesta para empresas</text><line x1="54" y1="200" x2="234" y2="200" stroke="#C9A227" stroke-width="2.5"/><text x="54" y="228" font-family="Lato" font-size="13" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="54" dy="0">Surtimos e instalamos árboles de Navidad naturales para lobbies, showrooms, oficinas, hoteles, restaurantes y torres</tspan><tspan x="54" dy="20">residenciales. Importamos directo del productor en Oregon, así que controlamos la calidad de cada árbol y respondemos por</tspan><tspan x="54" dy="20">él toda la temporada.</tspan></text><text x="54" y="314" font-family="EB Garamond" font-size="19" fill="#14251C">Tamaños disponibles</text><rect x="54" y="326" width="708" height="150" fill="#FFFFFF" stroke="#BACDB4" stroke-width="1"/><rect x="54" y="326" width="708" height="26" fill="#1B4630"/><text x="70" y="344" font-family="Lato" font-size="11" font-weight="bold" fill="#F2EFE6" letter-spacing="1.5">ALTURA</text><text x="184" y="344" font-family="Lato" font-size="11" font-weight="bold" fill="#F2EFE6" letter-spacing="1.5">ESPACIO RECOMENDADO</text><text x="746" y="344" font-family="Lato" font-size="11" font-weight="bold" fill="#F2EFE6" text-anchor="end" letter-spacing="1.5">PRECIO</text><text x="70" y="374" font-family="Lato" font-size="13" font-weight="bold" fill="#14251C">1 a 1.5 m</text><text x="184" y="374" font-family="Lato" font-size="12" fill="#4A5B50">Oficinas chicas, recepciones, escritorios</text><text x="746" y="374" font-family="Lato" font-size="13" font-weight="bold" fill="#C9A227" text-anchor="end">[PRECIO]</text><text x="70" y="401" font-family="Lato" font-size="13" font-weight="bold" fill="#14251C">1.8 a 2.2 m</text><text x="184" y="401" font-family="Lato" font-size="12" fill="#4A5B50">Salas de junta, restaurantes, consultorios</text><text x="746" y="401" font-family="Lato" font-size="13" font-weight="bold" fill="#C9A227" text-anchor="end">[PRECIO]</text><text x="70" y="428" font-family="Lato" font-size="13" font-weight="bold" fill="#14251C">2.5 a 3 m</text><text x="184" y="428" font-family="Lato" font-size="12" fill="#4A5B50">Entradas, salas de doble altura</text><text x="746" y="428" font-family="Lato" font-size="13" font-weight="bold" fill="#C9A227" text-anchor="end">[PRECIO]</text><text x="70" y="455" font-family="Lato" font-size="13" font-weight="bold" fill="#14251C">4 a 6 m</text><text x="184" y="455" font-family="Lato" font-size="12" fill="#4A5B50">Lobbies, showrooms, plazas, clubes</text><text x="746" y="455" font-family="Lato" font-size="13" font-weight="bold" fill="#C9A227" text-anchor="end">[PRECIO]</text><text x="70" y="468" font-family="Lato" font-size="10" fill="#4A5B50" font-style="italic">Precio por volumen y para grupos multi-unidad, a cotizar.</text><text x="54" y="502" font-family="EB Garamond" font-size="19" fill="#14251C">El servicio incluye</text><text x="421.0" y="502" font-family="EB Garamond" font-size="19" fill="#14251C">Por qué abeto noble</text><rect x="55" y="520" width="8" height="8" fill="#C9A227" transform="rotate(45 59 524)"/><text x="76" y="528" font-family="Lato" font-size="12.5" font-weight="bold" fill="#14251C">Entrega</text><text x="76" y="545" font-family="Lato" font-size="11" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="76" dy="0">En la fecha que ustedes fijen, dentro de CDMX y Edomex.</tspan></text><rect x="55" y="565" width="8" height="8" fill="#C9A227" transform="rotate(45 59 569)"/><text x="76" y="573" font-family="Lato" font-size="12.5" font-weight="bold" fill="#14251C">Instalación</text><text x="76" y="590" font-family="Lato" font-size="11" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="76" dy="0">Lo dejamos parado, montado en su base y sin embalaje.</tspan></text><rect x="55" y="610" width="8" height="8" fill="#C9A227" transform="rotate(45 59 614)"/><text x="76" y="618" font-family="Lato" font-size="12.5" font-weight="bold" fill="#14251C">Retiro</text><text x="76" y="635" font-family="Lato" font-size="11" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="76" dy="0">Pasamos por él al terminar la temporada.</tspan></text><rect x="55" y="655" width="8" height="8" fill="#C9A227" transform="rotate(45 59 659)"/><text x="76" y="663" font-family="Lato" font-size="12.5" font-weight="bold" fill="#14251C">Un contacto</text><text x="76" y="680" font-family="Lato" font-size="11" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="76" dy="0">Ustedes tratan directo con los dueños, no con un call center.</tspan></text><rect x="422.0" y="520" width="8" height="8" fill="#C9A227" transform="rotate(45 426.0 524)"/><text x="443.0" y="528" font-family="Lato" font-size="12" font-weight="normal" fill="#14251C" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="443.0" dy="0">Retiene más del 90% de su aguja a los 28 días</tspan></text><text x="443.0" y="548" font-family="Lato" font-size="9.5" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="0.85"><tspan x="443.0" dy="0">Christmas Tree Research Program, Oregon State University</tspan></text><rect x="422.0" y="564" width="8" height="8" fill="#C9A227" transform="rotate(45 426.0 568)"/><text x="443.0" y="572" font-family="Lato" font-size="12" font-weight="normal" fill="#14251C" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="443.0" dy="0">Rama rígida y horizontal: soporta adornos pesados</tspan></text><text x="443.0" y="592" font-family="Lato" font-size="9.5" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="0.85"><tspan x="443.0" dy="0">Característica estructural documentada del abeto noble</tspan></text><rect x="422.0" y="608" width="8" height="8" fill="#C9A227" transform="rotate(45 426.0 612)"/><text x="443.0" y="616" font-family="Lato" font-size="12" font-weight="normal" fill="#14251C" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="443.0" dy="0">Oregon es el mayor productor de Estados Unidos</tspan></text><text x="443.0" y="636" font-family="Lato" font-size="9.5" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="0.85"><tspan x="443.0" dy="0">Oregon Department of Agriculture / USDA</tspan></text><rect x="422.0" y="652" width="8" height="8" fill="#C9A227" transform="rotate(45 426.0 656)"/><text x="443.0" y="660" font-family="Lato" font-size="12" font-weight="normal" fill="#14251C" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="443.0" dy="0">De plantaciones comerciales, no de bosque nativo</tspan></text><text x="443.0" y="680" font-family="Lato" font-size="9.5" font-weight="normal" fill="#4A5B50" text-anchor="start" letter-spacing="0" opacity="0.85"><tspan x="443.0" dy="0">SEMARNAT</tspan></text><rect x="54" y="724" width="708" height="132" fill="#0E2A1C" rx="4"/><text x="74" y="754" font-family="EB Garamond" font-size="19" fill="#F2EFE6">Trazabilidad de importación</text><text x="74" y="776" font-family="Lato" font-size="11.5" font-weight="normal" fill="#BACDB4" text-anchor="start" letter-spacing="0" opacity="1.0"><tspan x="74" dy="0">Cada embarque entra al país bajo la NOM-013-SEMARNAT-2020 y es verificado por PROFEPA en la aduana. Podemos entregar a su</tspan><tspan x="74" dy="16">área de compras la documentación completa:</tspan></text><rect x="75" y="815" width="7" height="7" fill="#C9A227" transform="rotate(45 78.5 818.5)"/><text x="94" y="822" font-family="Lato" font-size="11.5" fill="#F2EFE6">Certificado fitosanitario internacional (NIMF-12) del estado de origen</text><rect x="75" y="834" width="7" height="7" fill="#C9A227" transform="rotate(45 78.5 837.5)"/><text x="94" y="841" font-family="Lato" font-size="11.5" fill="#F2EFE6">Registro de Verificación (RV) de PROFEPA</text><text x="742" y="844" font-family="Lato" font-size="9.5" fill="#BACDB4" text-anchor="end" font-style="italic" opacity="0.8">Documentos de la temporada, adjuntos a esta propuesta.</text><line x1="54" y1="876" x2="762" y2="876" stroke="#BACDB4" stroke-width="1"/><text x="54" y="902" font-family="Lato" font-size="12" fill="#4A5B50">Cuarta temporada · <tspan font-weight="bold" fill="#14251C">20 → 100 → 150</tspan> árboles entregados · el año pasado, 7 agencias automotrices</text><rect x="54" y="912" width="708" height="52" fill="none" stroke="#C9A227" stroke-width="1.5" rx="4"/><text x="72" y="932" font-family="Lato" font-size="12" font-weight="bold" fill="#14251C" letter-spacing="1.5">SIGUIENTE PASO</text><text x="72" y="952" font-family="Lato" font-size="11.5" fill="#4A5B50">Dinos cuántos árboles, de qué altura y para qué fecha los necesitan, y les mandamos la cotización.</text><text x="54" y="998" font-family="Lato" font-size="12.5" font-weight="bold" fill="#14251C">WhatsApp [WHATSAPP]  ·  [CORREO]  ·  [TUSITIO.COM]  ·  @arbolesdenavidad.mx</text></svg>